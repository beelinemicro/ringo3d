<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>RINGO 3D showcase</title>
<!-- Renders the app icon and the share banners from the real game: cube.js,
     the dice, the caller's callout, the win rays and confetti. Copy into
     public/ while generating (see scripts/make-assets.mjs). -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { display: block; min-height: 0; overflow: hidden; }
  #app { max-width: none; padding: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .icon { width: 100vw; height: 100vh; background: #070b16; }

  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og.square { width: 1200px; height: 1200px; }
  /* Play's 1024x500 feature graphic. It gets cropped at the edges on some
     layouts, so everything that matters sits well inside. */
  .og.feature { width: 1024px; height: 500px; }
  .og.feature .rays { left: 760px; top: 250px; }
  .og.feature .spill { left: 760px; top: 250px; width: 780px; height: 780px; }
  .og.feature .left { left: 56px; width: 430px; gap: 8px; }
  .og.feature .logo-ring { --rw: 52px; margin: 0 -6px; }
  .og.feature .title { font-size: 4.6rem; }
  .og.feature .tag1 { font-size: 1.5rem; margin-top: 6px; }
  .og.feature .tag2 { font-size: 1.02rem; max-width: 400px; line-height: 1.32; }
  .og.feature .pills, .og.feature .url { display: none; }
  .og.feature .panel { left: 545px; top: 22px; width: 456px; height: 456px; border-radius: 28px; }
  .og.feature .callout span { font-size: 4.4rem; transform: rotate(-5deg) translateY(-108px); }
  .og.feature .steal { font-size: 1.3rem; right: 18px; bottom: 14px; }
  .og.feature .dice-area { left: 402px; top: 330px; transform: rotate(-6deg) scale(0.74); }

  /* Game-show rays and a warm spill behind the cube's panel. */
  .og .rays { position: absolute; left: 870px; top: 315px; animation: none; opacity: 0.8; }
  .og.square .rays { left: 600px; top: 690px; }
  .og .spill { position: absolute; left: 870px; top: 315px; width: 1100px; height: 1100px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 211, 77, 0.35) 0%, rgba(255, 170, 40, 0.14) 28%, transparent 60%); pointer-events: none; }
  .og.square .spill { left: 600px; top: 690px; }

  .og .left { position: absolute; left: 58px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  /* Confetti only around the cube, so the words stay readable. */
  #confetti { position: absolute; left: 470px; top: -30px; width: 760px; height: 690px; }
  .og.square ~ #confetti, body.square #confetti { left: 150px; top: 300px; width: 900px; height: 820px; }
  .og .hero { margin: 0; align-items: flex-start; }
  .og .logo { margin-bottom: 2px; padding: 6px 0; }
  .og .logo-ring { --rw: 74px; margin: 0 -8px; animation: ring-in 0.01s both; }
  .og .title { font-size: 6.9rem; line-height: 0.95; white-space: nowrap; }
  .og .title::before { display: none; }
  .og .title-3d { font-size: 0.4em; margin-top: 0.1em; }
  .og .tag1 { margin: 10px 0 0; font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: 2.15rem; color: #fff7e0; letter-spacing: 0.01em; text-shadow: 0 2px 0 #b59a58, 0 6px 18px rgba(0, 0, 0, 0.5); }
  .og .tag2 { margin: 0; font-size: 1.32rem; font-weight: 500; color: #eaf4e6; opacity: 0.92; line-height: 1.35; max-width: 460px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
  .og .pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .og .pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 9px 12px; border-radius: 999px; font-weight: 700; font-size: 1.02rem; color: var(--ink);
    background: linear-gradient(180deg, #fffaf0 0%, #f3e6c8 100%); box-shadow: 0 4px 0 #b59d70, 0 8px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 #fff; }
  .og .pill svg { width: 22px; height: 22px; stroke: var(--ink); }
  .og .pill.gold { background: linear-gradient(180deg, #ffe58a 0%, #ffc632 40%, #f59d00 100%); color: #4a2e00; box-shadow: 0 4px 0 #a86300, 0 8px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.75); }
  .og .pill.gold svg { stroke: #4a2e00; }
  .og .url { margin-top: 10px; font-size: 1rem; font-weight: 600; letter-spacing: 0.04em; color: #cfe3d5; opacity: 0.8; max-width: 380px; }

  /* The cube's holo panel — big, glowing in the winner's colour. */
  .og .panel { position: absolute; left: 560px; top: 6px; width: 618px; height: 618px; border-radius: 34px; overflow: hidden; background: #070b16;
    border: 4px solid rgba(120, 170, 255, 0.28); --turn: #e5484d;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 110px -10px var(--turn), inset 0 0 0 1px rgba(160, 200, 255, 0.14), inset 0 0 80px rgba(40, 90, 200, 0.22); }
  .og.square .panel { left: 255px; top: 372px; width: 690px; height: 690px; }
  .og .panel::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 4px), linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.35)); }
  .og .callout { z-index: 4; }
  .og .callout span { animation: none; opacity: 1; font-size: 7.2rem; transform: rotate(-5deg) translateY(-160px); letter-spacing: 0.05em; }
  .og.square .callout span { font-size: 8.6rem; transform: rotate(-5deg) translateY(-200px); }
  .og .steal { position: absolute; right: 28px; bottom: 24px; z-index: 5; font-family: 'Lilita One', sans-serif; font-size: 2rem; color: #b9f1ff; letter-spacing: 0.06em; transform: rotate(-4deg);
    text-shadow: 0 2px 0 #1b5fb8, 0 4px 0 #0e3570, 0 0 20px rgba(79, 208, 255, 0.8); }

  /* Dice tumbling into frame over the panel's corner. */
  .og .dice-area { position: absolute; left: 448px; top: 470px; transform: rotate(-6deg); z-index: 6; gap: 14px; padding: 16px 18px 20px; }
  .og.square .dice-area { left: 70px; top: 1030px; }
  .og .die { --die: 74px; --half: 37px; }
  .og .die.wild-face { filter: drop-shadow(0 0 14px rgba(255, 211, 77, 0.8)); }

  .og.square .left { left: 0; right: 0; top: 28px; bottom: auto; width: auto; align-items: center; text-align: center; gap: 6px; }
  .og.square .hero { align-items: center; }
  .og.square .logo-ring { --rw: 88px; }
  .og.square .title { font-size: 8.4rem; }
  .og.square .tag1 { margin-top: 4px; font-size: 2.3rem; }
  .og.square .tag2 { display: none; }
  .og.square .pills { position: absolute; right: 70px; top: 1056px; margin: 0; }
  .og.square .url { position: absolute; left: 0; right: 0; top: 1122px; text-align: center; margin: 0; max-width: none; }
</style></head>
<body>
<canvas id="confetti"></canvas>
<div id="ambient" aria-hidden="true">
  <span class="amb a0"></span><span class="amb a1"></span><span class="amb a2"></span><span class="amb a3"></span><span class="amb a4"></span>
</div>
<main id="app"><div id="stage"></div></main>
<script type="module">
  import { createCube } from './js/cube.js';
  import { idx } from './js/game.js';
  import { burst } from './js/confetti.js';
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'icon';
  const stage = document.getElementById('stage');
  const board = Array(125).fill(null);
  // Red wins corner to corner through the middle — the 3D-only line.
  [0, 1, 2, 3, 4].forEach((k) => { board[idx(k, k, k)] = 0; });
  // Yellow four-in-a-row down column O, one short; the rest scattered.
  [[4,0,0],[4,1,0],[4,2,0],[4,3,0]].forEach(([x,y,z]) => { board[idx(x,y,z)] = 1; });
  [[0,4,0],[1,4,1],[3,1,3]].forEach(([x,y,z]) => { board[idx(x,y,z)] = 2; });
  [[4,4,0],[0,0,4],[3,3,0],[1,0,2]].forEach(([x,y,z]) => { board[idx(x,y,z)] = 3; });
  [[2,0,2],[1,2,4],[3,4,2]].forEach(([x,y,z]) => { board[idx(x,y,z)] = 4; });
  const win = [[0, 1, 2, 3, 4].map((k) => idx(k, k, k))];
  const ICON_DICE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>';
  const ICON_BOT = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3.5"/><path d="M12 8V5M12 5a1.5 1.5 0 1 0-.01 0"/><circle cx="9" cy="13.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13.5" r="1.3" fill="currentColor" stroke="none"/><path d="M9.5 17h5"/><path d="M4 12H2M22 12h-2"/></svg>';
  const ICON_GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>';
  if (kind === 'icon') {
    stage.innerHTML = '<div class="icon"><canvas id="c"></canvas></div>';
  } else {
    const square = kind === 'og-square';
    const feature = kind === 'feature';
    if (square) document.body.classList.add('square');
    stage.innerHTML = `<div class="og ${square ? 'square' : ''}${feature ? ' feature' : ''}">
      <div class="spill"></div>
      <div class="banner-rays rays"></div>
      <div class="left">
        <div class="hero">
          <div class="logo" aria-hidden="true"><span class="logo-ring c0"></span><span class="logo-ring c1"></span><span class="logo-ring c2"></span><span class="logo-ring c3"></span><span class="logo-ring c4"></span></div>
          <h1 class="title" data-text="RINGO">RINGO<span class="title-3d">3D</span></h1>
        </div>
        <p class="tag1">Dad&rsquo;s game, cubed.</p>
        <p class="tag2">Three dice, a 5&times;5&times;5 cube of glass, and rings that steal spots. Five in a row, or four corners of a face &mdash; <strong>with an added twist</strong>: turn any slice Rubik&rsquo;s-style and swing whole lines into place.</p>
        <div class="pills">
          <span class="pill">${ICON_DICE}Pass &amp; Play</span>
          <span class="pill">${ICON_BOT}vs Computer</span>
          <span class="pill gold">${ICON_GLOBE}Family rooms online</span>
        </div>
        <div class="url">ringo3d.beelinemicrosystems.com</div>
      </div>
      <div class="panel">
        <canvas id="c"></canvas>
        <div class="callout show"><span>RINGO!</span></div>
        <div class="steal">TWIST!</div>
      </div>
      <div class="dice-area">
        <div class="die" id="die-col"><div class="cube-die"><div class="face f0">R</div><div class="face f1">I</div><div class="face f2">N</div><div class="face f3">G</div><div class="face f4">O</div><div class="face f5 wild">&#9733;</div></div></div>
        <div class="die" id="die-row"><div class="cube-die"><div class="face f0">1</div><div class="face f1">2</div><div class="face f2">3</div><div class="face f3">4</div><div class="face f4">5</div><div class="face f5 wild">&#9733;</div></div></div>
        <div class="die die-layer wild-face" id="die-layer"><div class="cube-die" style="transform: rotateX(-16deg) rotateY(-20deg) rotateX(90deg) rotateY(0deg)"><div class="face f0 l0">Sky</div><div class="face f1 l1">Violet</div><div class="face f2 l2">Mint</div><div class="face f3 l3">Peach</div><div class="face f4 l4">Rose</div><div class="face f5 wild">&#9733;</div></div></div>
      </div>
    </div>`;
  }
  const canvas = document.getElementById('c');
  const cube = createCube(canvas, { minimal: true, showLabels: kind !== 'icon' });
  cube.setAngles(kind === 'icon' ? -0.7 : -0.62, kind === 'icon' ? 0.42 : 0.38);
  cube.setZoom(kind === 'icon' ? 0.9 : kind === 'feature' ? 1.2 : 1.12);
  cube.sync({ board, winLines: win, current: 0, instant: true });
  document.fonts.ready.then(() => {
    if (kind !== 'icon') setTimeout(() => burst(document.getElementById('confetti'), ['#e5484d', '#ffd34d', '#ffffff', '#3a7bd5', '#30a46c']), 900);
    setTimeout(() => { window.__ready = true; }, kind === 'icon' ? 1400 : 2000);
  });
</script>
</body></html>
